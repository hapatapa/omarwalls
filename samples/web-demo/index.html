<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; background: var(--bg); }
  canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Theme-aware web wallpaper: reads window.webwallTheme (injected by the host
// from Omarchy's colors.toml) and falls back to sensible defaults when absent.
var th = window.webwallTheme || {};
function hex(c, d) {
  if (typeof c === "string" && c.length >= 6) {
    var r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
    return {r:r,g:g,b:b};
  }
  return {r:d[0],g:d[1],b:d[2]};
}
var bg   = hex(th.bg,      [16,14,18]);
var fg   = hex(th.fg,      [240,230,232]);
var acc  = hex(th.accent,  [140,107,107]);
var sel  = hex(th.selection,[55,34,35]);
var muted= hex(th.muted,   [90,60,60]);
var c = document.getElementById("c");
var ctx = c.getContext("2d");
// The host injects innerWidth/innerHeight already multiplied by 10 (hi-res
// trick). The browser clamps canvas buffers ~16k px, so scale the coordinate
// space back down to ~native pixels instead of building a huge bitmap.
var SCALE = window.innerWidth > 4000 ? 0.1 : 1;
function resize(){
  var w = window.innerWidth * SCALE;
  var h = window.innerHeight * SCALE;
  c.width = w; c.height = h;
}
window.addEventListener("resize", resize); resize();

var t0 = performance.now();
function frame(t){
  var w = c.width, h = c.height;
  var time = (t - t0) / 1000;
  ctx.fillStyle = "rgb("+bg.r+","+bg.g+","+bg.b+")";
  ctx.fillRect(0,0,w,h);

  // drifting diagonals in accent/selection
  var steps = 26;
  for (var i=0;i<steps;i++){
    var x = ((i/steps) * (w+h) - time * (60 + (i%5)*25)) % (w+h);
    var color = i%2 ? acc : sel;
    ctx.strokeStyle = "rgba("+color.r+","+color.g+","+color.b+",0.5)";
    ctx.lineWidth = i%2 ? 2 : 10;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x-h, h);
    ctx.stroke();
  }

  // pulsing orb center
  var px = w/2, py = h/2;
  var rr = Math.min(w,h) * (0.10 + 0.05*Math.sin(time*2));
  var grad = ctx.createRadialGradient(px,py,0, px,py,rr*2);
  grad.addColorStop(0,"rgba("+acc.r+","+acc.g+","+acc.b+",0.55)");
  grad.addColorStop(1,"rgba("+bg.r+","+bg.g+","+bg.b+",0)");
  ctx.fillStyle = grad;
  ctx.fillRect(px-rr*2, py-rr*2, rr*4, rr*4);

  // theme swatch strip
  var sw = w/16;
  for (var i2=0;i2<16;i2++){
    ctx.fillStyle = "rgba("+fg.r+","+fg.g+","+fg.b+","+(0.25+0.5*i2/15)+")";
    ctx.fillRect(i2*sw, h-6, sw, 4);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// demonstrate theme access in console (proof of injection)
console.log("webwall demo theme:", JSON.stringify(window.webwallTheme));
</script>
</body>
</html>
